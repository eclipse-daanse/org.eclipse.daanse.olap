AS.Operation.param.Set_Expression.description=Set Expression
AS.Operation.param.Alias.description=Alias

Abs.caption=Abs Function
Abs.description=Returns a value of the same type that is passed to it specifying the absolute value of a number.
Abs.example=<Numeric Expression> Abs(<Numeric Expression>)
Abs.param.Number.description=Numeric Expression

Acos.caption=Acos Function
Acos.description=Returns the arccosine, or inverse cosine, of a number. The arccosine is the angle whose cosine is Arg1. The returned angle is given in radians in the range 0 (zero) to pi.
Acos.example=<Numeric Expression> Acos(<Numeric Expression>)
Acos.param.Number.description=Numeric Expression

Acosh.caption=Acosh Function
Acosh.description=Returns the inverse hyperbolic cosine of a number. Number must be greater than or equal to 1. The inverse hyperbolic cosine is the value whose hyperbolic cosine is Arg1, so Acosh(Cosh(number)) equals Arg1.
Acosh.example=<Numeric Expression> Acosh(<Numeric Expression>)
Acosh.param.Number.description=Numeric Expression

AddCalculatedMembers.Function.caption=AddCalculatedMembers Function
AddCalculatedMembers.Function.description=Adds calculated members to a set.
AddCalculatedMembers.Function.example=<Set> AddCalculatedMembers(<Set>)
AddCalculatedMembers.Function.param.Set.description=Set

Aggregate.Function.caption=Aggregate Function
Aggregate.Function.description=Returns a calculated value using the appropriate aggregate function, based on the context of the query.
Aggregate.Function.example=<Numeric Expression> Aggregate(<Set>, <Numeric Expression>)
Aggregate.Function.param.Set.description=Set
Aggregate.Function.param.Numeric_Expression.description=(Optional) A numeric expression, typically a measure. If not specified, the default measure for the current context is used.

AggregateChildren.caption=AggregateChildren
AggregateChildren.description=Equivalent to 'Aggregate(<Hierarchy>.CurrentMember.Children); for internal use.
AggregateChildren.example=<Numeric Expression> $AggregateChildren(<Hierarchy>)
AggregateChildren.param.Hierarchy.description=Hierarchy

Ancestor.Member.Distance.Function.caption=Ancestor(Member,Distance) Function
Ancestor.Member.Distance.Function.description=Returns the ancestor of a member at a specified level, defined by the distance.
Ancestor.Member.Distance.Function.example=<Member> Ancestor(<Member>, <Numeric Expression>)
Ancestor.Member.Distance.Function.param.Member.description=The Member for which the ancestor is being sought
Ancestor.Member.Distance.Function.param.Distance.description=A number specifying the number of levels up the hierarchy. 0 — the element itself, 1 — the parent, 2 — the grandparent, etc.

