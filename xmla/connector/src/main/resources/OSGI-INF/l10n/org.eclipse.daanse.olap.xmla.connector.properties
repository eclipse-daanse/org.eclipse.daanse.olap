ocd.name=Daanse XMLA Connector Sessions
ocd.description=How long an XMLA session lives. The protocol defines no lifetime, so it is decided here, where the connections a session holds actually live. Every duration is in seconds and 0 means never.

sessionIdleTimeoutSeconds.name=Idle timeout (seconds)
sessionIdleTimeoutSeconds.description=How long a session may go unused before it is ended and its connections closed. 0 keeps sessions until the client ends them. The default matches what Analysis Services documents as its own minimum.

sessionMaxLifetimeSeconds.name=Maximum lifetime (seconds)
sessionMaxLifetimeSeconds.description=How long a session may live however busy it is. 0 places no limit.

sessionSweepIntervalSeconds.name=Sweep interval (seconds)
sessionSweepIntervalSeconds.description=How often expired sessions are swept up. This bounds how long a session outlives its timeout; a session presented by a request is checked immediately regardless.

maxSessions.name=Maximum open sessions
maxSessions.description=How many sessions may be open at once. Further BeginSession requests are declined rather than answered with a session this server cannot serve. 0 places no limit.
