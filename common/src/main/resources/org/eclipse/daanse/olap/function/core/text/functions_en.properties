Ancestor.Member.Level.Function.param.Member.description=The Member for which the ancestor is being sought
Ancestor.Member.Level.Function.param.Level.description=The hierarchy level at which the ancestor is to be found.

Ancestors.Member.Level.Function.caption=Ancestors Function
