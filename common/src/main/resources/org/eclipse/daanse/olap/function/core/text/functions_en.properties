Asinh.caption=Asinh Function
Asinh.description=Returns the inverse hyperbolic sine of a number. The inverse hyperbolic sine is the value whose hyperbolic sine is Arg1, so Asinh(Sinh(number)) equals Arg1.
Asinh.example=<Numeric Expression> Asinh(<Numeric Expression>)
Asinh.param.Number.description=Numeric Expression

Atan2.caption=Atan2 Function
Atan2.description=Returns the arctangent, or inverse tangent, of the specified x- and y-coordinates. The arctangent is the angle from the x-axis to a line containing the origin (0, 0) and a point with coordinates (x_num, y_num). The angle is given in radians between -pi and pi, excluding -pi.
Atan2.example=<Numeric Expression> Atan2(<Numeric Expression>, <Numeric Expression>)
Atan2.param.XNum.description=X-coordinate of the point
Atan2.param.YNum.description=Y-coordinate of the point

Atanh.caption=Atanh Function
Atanh.description=Returns the inverse hyperbolic tangent of a number. Number must be between -1 and 1 (excluding -1 and 1).
Atanh.example=<Numeric Expression> Atanh(<Numeric Expression>)
Atanh.param.Number.description=Numeric Expression

Atn.caption=Atn Function
Atn.description=Returns a Double specifying the arctangent of a number.
